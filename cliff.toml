# git-cliff: works out the next version from the
# Conventional Commit squash titles on main.
# https://git-cliff.org/docs/configuration

[git]
conventional_commits = true
filter_unconventional = true
# Only commits matched by a parser below count towards a release.
filter_commits = true
protect_breaking_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^build", group = "Build" },
  { message = "^revert", group = "Reverts" },
  # No release for these on their own.
  { message = "^(ci|chore|docs|test|style)", skip = true },
]

[bump]
# feat → minor, breaking → major, everything else above → patch.
features_always_bump_minor = true
breaking_always_bump_major = true
