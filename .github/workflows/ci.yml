name: CI

# No run on push to main: every commit reaches main through the merge
# queue, which already ran CI on that exact commit.
on:
  pull_request:
    branches:
      - main
  # Runs the required checks on the merge queue's temporary branch.
  merge_group:

  # add manual trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuous-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Keep in step with the oven/bun image in docker/Dockerfile.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - run: bun run check:ci
      - run: bun run typecheck
      - run: bun run test

  continuous-integration-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # test docker build
      - name: Docker pull latest images
        working-directory: ./docker
        run: docker compose pull

      - name: Docker build
        working-directory: ./docker
        run: docker compose -f ./docker-compose.yml -f ./docker-compose.build.yml build

      # Apply every migration to a fresh database, as the migrate service does
      # in production.
      - name: Apply database migrations
        working-directory: ./docker
        env:
          POSTGRES_PASSWORD: ci
        run: docker compose run --rm migrate
