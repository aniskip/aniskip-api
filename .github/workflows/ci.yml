name: CI

# No run on push to main: every commit reaches main through the merge
# queue, which already ran CI on that exact commit.
on:
  pull_request:
    branches:
      - main
  # Runs the required checks on the merge queue's temporary branch.
  merge_group:

  # add manual trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuous-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Installs the vite-plus version from package.json, and Bun from its
      # packageManager field, then runs `vp install`.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - run: vp check
      - run: vp run test

  continuous-integration-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # test docker build
      - name: Docker pull latest images
        working-directory: ./docker
        run: docker compose pull

      - name: Docker build
        working-directory: ./docker
        run: docker compose -f ./docker-compose.yml -f ./docker-compose.build.yml build

      - name: Start the stack
        working-directory: ./docker
        env:
          POSTGRES_PASSWORD: ci
        run: docker compose up -d --wait --wait-timeout 120

      - name: Check the API
        run: |
          curl -fsS http://127.0.0.1:5100/health
          curl -fsS http://127.0.0.1:5100/v2/relation-rules/40028 > /dev/null
          curl -fsS http://127.0.0.1:5100/openapi.json > /dev/null

      - name: Show logs
        if: failure()
        working-directory: ./docker
        env:
          POSTGRES_PASSWORD: ci
        run: docker compose logs

      - name: Stop the stack
        if: always()
        working-directory: ./docker
        env:
          POSTGRES_PASSWORD: ci
        run: docker compose down -v
