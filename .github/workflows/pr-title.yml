name: PR title

# The squash commit title decides the next version (see cliff.toml), so PR
# titles must be Conventional Commits.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in step with the commit_parsers in cliff.toml.
          types: |
            feat
            fix
            perf
            refactor
            build
            revert
            ci
            chore
            docs
            test
            style
