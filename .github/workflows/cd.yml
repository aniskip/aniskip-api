name: CD

on:
  push:
    branches:
      - main
  # Redeploys the latest version without creating a new one.
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once.
concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the version tag
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout repo with full history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Keep in step with the oven/bun image in docker/Dockerfile.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - name: Tag the next version
        id: bump
        run: |
          latest=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          next=$(bunx git-cliff --bumped-version 2>/dev/null)

          if [[ -n $next && $next != "$latest" ]]; then
            git tag "$next" "$GITHUB_SHA"
            git push origin "$next"
            echo "Tagged $next (previous: ${latest:-none})"
            echo "version=${next#v}" >> "$GITHUB_OUTPUT"
          elif [[ $GITHUB_EVENT_NAME == workflow_dispatch && -n $latest ]]; then
            echo "Redeploying $latest"
            echo "version=${latest#v}" >> "$GITHUB_OUTPUT"
          else
            echo "No release-worthy commits since $latest, nothing to deploy."
          fi

  continuous-delivery:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      VERSION: ${{ needs.release.outputs.version }}
    defaults:
      run:
        working-directory: ./docker

    steps:
      - name: Checkout the tagged version and submodules
        uses: actions/checkout@v7
        with:
          ref: v${{ env.VERSION }}
          submodules: recursive

      # package.json keeps 0.0.0-development in git; the image gets the real
      # version (shown in the API docs).
      - name: Stamp the version into package.json
        working-directory: .
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Docker login
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: printf '%s' "$DOCKER_TOKEN" | docker login --username "$DOCKER_USERNAME" --password-stdin

      - name: Docker pull latest images
        run: docker compose pull

      - name: Docker build
        run: docker compose -f ./docker-compose.yml -f ./docker-compose.build.yml build

      - name: Docker tag
        run: docker tag "$DOCKER_USERNAME/aniskip-api:latest" "$DOCKER_USERNAME/aniskip-api:$VERSION"

      - name: Docker push with tag
        run: docker push "$DOCKER_USERNAME/aniskip-api:$VERSION"

      - name: Docker push with latest tag
        run: docker compose -f ./docker-compose.yml -f ./docker-compose.build.yml push

      # The server has no public SSH port: connect through the Cloudflare Tunnel,
      # authenticating to Cloudflare Access with a service token.
      # Pinned to the v1.0.0 commit, reviewed 2026-11-01. It's a composite action
      # with no nested actions, so the SHA pins everything it runs.
      - name: Connect to the server
        uses: NX1X/cloudflare-tunnel-ssh-action@5b09bfc4ba3dc20b3d77d96271fff5a20fe64107 # v1.0.0
        with:
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ssh-private-key: ${{ secrets.KEY }}
          ssh-host: ssh.aniskip.com
          ssh-user: ${{ secrets.USERNAME }}
          cloudflared-version: 2026.10.0

      - name: Deploy to production
        env:
          SSH_TARGET: ${{ secrets.USERNAME }}@ssh.aniskip.com
          REPO_PATH: ${{ secrets.REPO_PATH }}
        run: |
          ssh "$SSH_TARGET" bash -s -- "$REPO_PATH" <<'EOF'
          set -euo pipefail
          cd "$1/docker"
          git checkout main
          git pull --recurse-submodules
          docker compose pull
          ./stop.sh
          ./start.sh prod
          EOF
