# Postgres and Redis for local development. The API itself runs on the host
# with `bun run dev`. Ports are bound to localhost only.
name: aniskip-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18.
      - postgres_data:/var/lib/postgresql

  migrate:
    image: ghcr.io/amacneil/dbmate:2.37.0
    profiles:
      - tools
    command: up
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/db?sslmode=disable
      # Retry until Postgres accepts connections (up to a minute).
      DBMATE_WAIT: "true"
      # Don't write db/schema.sql.
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      # Writable so `db:new` can create migration files.
      - ../db/migrations:/db/migrations
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
      start_interval: 1s
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
