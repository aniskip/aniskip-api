# Postgres and Redis for local development. The API itself runs on the host
# with `bun run dev`. Ports are bound to localhost only.
name: aniskip-dev

services:
  db:
    build:
      dockerfile: ./sql_scripts/Dockerfile
      context: ".."
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  database_data:
