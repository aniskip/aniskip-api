services:
  api:
    image: lexesjan/aniskip-api
    restart: always
    # Only reachable from this machine (Cloudflare Tunnel / reverse proxy).
    ports:
      - "127.0.0.1:5100:5100"
    networks:
      - network
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      REDIS_HOST: redis
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: db
    networks:
      - network
    volumes:
      - database_data:/var/lib/postgresql/data

  migrate:
    image: ghcr.io/amacneil/dbmate:2.37.0
    command: up
    environment:
      DATABASE_URL: postgres://postgres@db:5432/db?sslmode=disable
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Retry until Postgres accepts connections (up to a minute).
      DBMATE_WAIT: "true"
      # Don't write db/schema.sql; the migrations folder is read-only.
      DBMATE_NO_DUMP_SCHEMA: "true"
    networks:
      - network
    volumes:
      - ../db/migrations:/db/migrations:ro
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - network
    volumes:
      - redis_data:/data

networks:
  network:
    driver: bridge

volumes:
  database_data:
  redis_data:
