services:
  api:
    image: lexesjan/aniskip-api
    restart: always
    # Only reachable from this machine (Cloudflare Tunnel / reverse proxy).
    ports:
      - "127.0.0.1:5100:5000"
    networks:
      - network
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
    depends_on:
      - db

  db:
    image: lexesjan/aniskip-database
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - network
    volumes:
      - database_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - network
    volumes:
      - redis_data:/data

networks:
  network:
    driver: bridge

volumes:
  database_data:
  redis_data:
