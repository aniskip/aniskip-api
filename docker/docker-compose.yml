# Docker keeps container logs on disk. The local driver compresses them and
# keeps at most 5 files of 10 MB per container, so they can't fill the disk.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  api:
    image: lexesjan/aniskip-api
    logging: *logging
    restart: always
    # Only reachable from this machine (Cloudflare Tunnel / reverse proxy).
    ports:
      - "127.0.0.1:5100:5100"
    networks:
      - network
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      REDIS_HOST: redis
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    logging: *logging
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: db
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s
    networks:
      - network
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18.
      - postgres_data:/var/lib/postgresql

  migrate:
    image: ghcr.io/amacneil/dbmate:2.37.0
    logging: *logging
    command: up
    environment:
      DATABASE_URL: postgres://postgres@db:5432/db?sslmode=disable
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Retry until Postgres accepts connections (up to a minute).
      DBMATE_WAIT: "true"
      # Don't write db/schema.sql; the migrations folder is read-only.
      DBMATE_NO_DUMP_SCHEMA: "true"
    networks:
      - network
    volumes:
      - ../db/migrations:/db/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
      start_interval: 1s
    restart: always
    networks:
      - network
    volumes:
      - redis_data:/data

networks:
  network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
